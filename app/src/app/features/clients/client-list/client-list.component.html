<div class="page">
  <header class="topbar">
    <h1>{{ t.title }}</h1>
    <button type="button" class="link" (click)="logout()">{{ t.logout }}</button>
  </header>

  <div class="toolbar">
    <input type="search" [placeholder]="t.searchPlaceholder" [ngModel]="search()" (ngModelChange)="search.set($event)" />
    <button type="button" class="primary" (click)="toggleForm()">{{ t.newClient }}</button>
  </div>

  @if (showForm()) {
    <form class="client-form" (ngSubmit)="saveClient()">
      <label>
        {{ t.firstName }}
        <input type="text" name="firstName" [(ngModel)]="firstName" required />
      </label>
      <label>
        {{ t.lastName }}
        <input type="text" name="lastName" [(ngModel)]="lastName" required />
      </label>
      <div class="form-actions">
        <button type="button" class="ghost" (click)="toggleForm()">{{ t.cancel }}</button>
        <button type="submit" class="primary" [disabled]="saving()">{{ t.save }}</button>
      </div>
    </form>
  }

  @if (!loading()) {
    @if (filteredClients().length === 0) {
      <p class="empty">{{ t.empty }}</p>
    } @else {
      <ul class="client-cards">
        @for (client of filteredClients(); track client.id) {
          <li class="client-card" (click)="openClient(client)">
            <span class="name">{{ client.first_name }} {{ client.last_name }}</span>
          </li>
        }
      </ul>
    }
  }
</div>
