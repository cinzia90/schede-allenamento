    // Supporto SPA per GitHub Pages (demo su cinzia90.github.io): decodifica
    // il percorso codificato da 404.html e lo ripristina prima che Angular
    // faccia il bootstrap, così refresh e link diretti funzionano.
    // https://github.com/rafgraph/spa-github-pages
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search
          .slice(1)
          .split('&')
          .map(function (s) {
            return s.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
      }
    })(window.location);
  </script>
